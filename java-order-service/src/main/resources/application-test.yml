spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: false

logging:
  level:
    root: WARN
    com.orderservice: INFO
    org.springframework.web: INFO

# External Services Configuration
inventory:
  service:
    url: http://localhost:8000

customer:
  service:
    url: http://localhost:8081
